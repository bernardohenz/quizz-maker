<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferir questões públicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="criar.css">
  <style>
    .revisar-container { max-width: 820px; }
    .revisar-top {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .revisar-top h1 { font-size: 1.7rem; margin-bottom: 8px; }
    .revisar-top p, .card-note, .card-meta { color: var(--text-muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .filters button, .card-actions button { cursor: pointer; }
    .filters button {
      border: 2px solid transparent;
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 700;
    }
    .filters button.active { border-color: var(--primary); background: #fff4ef; }
    .review-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .review-card.done { opacity: 0.55; }
    .card-kicker { font-weight: 800; color: var(--primary-dark); margin-bottom: 6px; }
    .stem { white-space: pre-wrap; margin: 14px 0; line-height: 1.45; }
    .option {
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 6px;
      background: #f6f7fb;
    }
    .option.correct { background: #e5f8ea; font-weight: 800; }
    .card-note {
      background: #fff8dc;
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .card-actions button, .links a {
      font-family: inherit;
      font-weight: 800;
    }
    .links { margin-top: 12px; display: flex; gap: 14px; }
    .status-line { margin-top: 10px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="app-container revisar-container">
    <section class="revisar-top">
      <div class="links">
        <a href="criar.html">Voltar a criar</a>
        <a href="incluir.html">Incluir à mão</a>
      </div>
      <h1>Conferir antes de entrar no banco</h1>
      <p id="aviso"></p>
      <p>Incluir grava no banco que o servidor está usando. Com Supabase no <code>.env</code>, isso é a tabela <code>question_bank</code>. Para gravar só num arquivo local, suba o servidor com <code>QUESTION_BANK_PATH</code>.</p>
      <p id="progresso"></p>
      <div class="filters" id="filters"></div>
    </section>
    <div id="lista"></div>
  </div>
  <script src="lib/grades.js"></script>
  <script src="revisar.js"></script>
</body>
</html>
